name: muse

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: muse
      POSTGRES_PASSWORD: muse
      POSTGRES_DB: muse
    ports:
      - "5433:5432"
    volumes:
      - muse_pgdata:/var/lib/postgresql/data
      - ./services/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muse -d muse"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./services/api
    env_file:
      - .env
    environment:
      MUSE_DATABASE_URL: postgresql+asyncpg://muse:muse@db:5432/muse
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      - muse_media:/data/media
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn muse.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./services/api
    env_file:
      - .env
    environment:
      MUSE_DATABASE_URL: postgresql+asyncpg://muse:muse@db:5432/muse
    volumes:
      - ./services/api:/app
      - muse_media:/data/media
    depends_on:
      db:
        condition: service_healthy
    command: python -m muse.worker.scheduler

volumes:
  muse_pgdata:
  muse_media:
