name: muse

services:
  # Local Postgres — opt-in only (`docker compose --profile local up`).
  # Production points MUSE_DATABASE_URL at Supabase instead; nothing depends
  # on this service by default, so a plain `up -d` never starts it.
  db:
    image: pgvector/pgvector:pg16
    profiles: ["local"]
    environment:
      POSTGRES_USER: muse
      POSTGRES_PASSWORD: muse
      POSTGRES_DB: muse
    ports:
      - "5433:5432"
    volumes:
      - muse_pgdata:/var/lib/postgresql/data
      - ./services/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muse -d muse"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./services/api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      - muse_media:/data/media
    command: uvicorn muse.main:app --host 0.0.0.0 --port 8000 --reload
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker:
    build:
      context: ./services/api
    env_file:
      - .env
    volumes:
      - ./services/api:/app
      - muse_media:/data/media
    command: python -m muse.worker.scheduler

  web:
    build:
      context: ./apps/web
      args:
        # Empty = relative /api/... calls, proxied server-side by the
        # rewrite in next.config.mjs. Works regardless of which public
        # hostname ends up serving this — no per-domain rebuild needed.
        NEXT_PUBLIC_API_BASE: ""
        MUSE_API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  muse_pgdata:
  muse_media:
